<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23CCD5AE'/%3E%3Cpath d='M12 6v12M6 12h12' stroke='%232F3A24' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedFind — Sign Up</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="header" data-header></header>

    <main class="page">
      <div class="container">
        <div class="form__card">
          <h1 class="form__title">Create your account</h1>
          <p class="form__subtitle">Join MedFind to search medicines and save your cart.</p>

          <form id="signupForm" novalidate>
            <div class="field" id="field-name">
              <label class="field__label" for="name">Full Name</label>
              <input class="field__input" type="text" id="name" name="name" placeholder="Your full name" autocomplete="name" />
              <div class="field__error">Please enter your full name.</div>
            </div>

            <div class="field" id="field-email">
              <label class="field__label" for="email">Email</label>
              <input class="field__input" type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" />
              <div class="field__error">Please enter a valid email address.</div>
            </div>

            <div class="field" id="field-phone">
              <label class="field__label" for="phone">Phone Number</label>
              <input class="field__input" type="tel" id="phone" name="phone" placeholder="01xxxxxxxxx" autocomplete="tel" />
              <div class="field__error">Please enter a valid phone number.</div>
            </div>

            <div class="field" id="field-password">
              <label class="field__label" for="password">Password</label>
              <input class="field__input" type="password" id="password" name="password" placeholder="At least 6 characters" autocomplete="new-password" />
              <div class="field__error">Password must be at least 6 characters.</div>
            </div>

            <div class="field" id="field-confirm">
              <label class="field__label" for="confirm">Confirm Password</label>
              <input class="field__input" type="password" id="confirm" name="confirm" placeholder="Re-enter your password" autocomplete="new-password" />
              <div class="field__error">Passwords do not match.</div>
            </div>

            <button class="btn btn--primary btn--block btn--lg" type="submit">Create Account</button>
          </form>

          <p class="form__alt">Already have an account? <a href="login.html">Log in</a></p>
        </div>
      </div>
    </main>

    <footer class="footer" data-footer></footer>
    <script type="module" src="/js/auth.js"></script>
  </body>
</html>

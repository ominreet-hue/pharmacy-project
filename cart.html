<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23CCD5AE'/%3E%3Cpath d='M12 6v12M6 12h12' stroke='%232F3A24' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedFind — Your Cart</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="header" data-header></header>

    <main class="page">
      <div class="container">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="index.html">Home</a>
          <span class="sep">/</span>
          <span class="current">Cart</span>
        </nav>

        <h1 class="section-title">Your Cart</h1>

        <!-- Empty state -->
        <div class="empty" id="cartEmpty">
          <div class="empty__icon">🛒</div>
          <div class="empty__title">Your cart is empty</div>
          <p class="empty__desc">Search for a medicine and add it to your cart.</p>
          <a class="btn btn--primary" href="medicines.html">Browse Medicines</a>
        </div>

        <!-- Cart content -->
        <div id="cartContent" class="hide">
          <div class="cart-layout">
            <section aria-label="Cart items">
              <div id="cartList" class="grid gap-2"></div>

              <!-- Location -->
              <section class="section mt-3" id="locationSection">
                <div class="card card--peach">
                  <h3 class="mb-2">Enter your location</h3>
                  <p class="text-muted mb-2">Find pharmacies near you that stock your medicines.</p>
                  <div class="flex gap-1 flex-wrap">
                    <label for="locationInput" class="sr-only">Enter your location</label>
                    <input class="field__input" type="text" id="locationInput" placeholder="Enter your location..." style="flex:1;min-width:200px" />
                    <button class="btn btn--primary" type="button" id="findPharmaciesBtn">Find Nearby Pharmacies</button>
                    <button class="btn btn--ghost" type="button" id="useGeoBtn">Use my location</button>
                  </div>
                  <div id="pharmacyResults" class="mt-3"></div>
                </div>
              </section>
            </section>

            <aside aria-label="Order summary">
              <div class="summary" id="cartSummary"></div>
            </aside>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer" data-footer></footer>
    <script type="module" src="js/cart-page.js"></script>
  </body>
</html>

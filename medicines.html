<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23CCD5AE'/%3E%3Cpath d='M12 6v12M6 12h12' stroke='%232F3A24' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedFind — Medicines</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="header" data-header></header>

    <main class="page">
      <div class="container">
        <h1 class="section-title">Medicines</h1>
        <p class="section-subtitle">Search, filter, and compare medicines across categories.</p>

        <div class="layout-sidebar">
          <!-- Filters -->
          <aside class="filters" aria-label="Filters">
            <h3>Filters</h3>
            <form id="filterForm">
              <div class="filters__group">
                <h4>Search</h4>
                <div class="searchbar" style="margin:0">
                  <label for="filterSearch" class="sr-only">Search medicines</label>
                  <input type="text" id="filterSearch" placeholder="Medicine name..." />
                </div>
              </div>

              <div class="filters__group">
                <h4>Category</h4>
                <div id="filterCategories"></div>
              </div>

              <div class="filters__group">
                <h4>Price Range (EGP)</h4>
                <div class="flex gap-1" style="align-items:center">
                  <input class="field__input" type="number" id="minPrice" placeholder="Min" min="0" style="width:90px" />
                  <span>—</span>
                  <input class="field__input" type="number" id="maxPrice" placeholder="Max" min="0" style="width:90px" />
                </div>
              </div>

              <div class="filters__group">
                <h4>Availability</h4>
                <label><input type="checkbox" id="availOnly" /> Available only</label>
              </div>

              <div class="filters__group">
                <h4>Medicine Form</h4>
                <div id="filterForms"></div>
              </div>

              <button class="btn btn--ghost btn--block btn--sm" type="button" id="clearFilters">Clear Filters</button>
            </form>
          </aside>

          <!-- Results -->
          <section aria-label="Medicine results">
            <div class="sort-bar">
              <label for="sortBy">Sort by:</label>
              <select id="sortBy">
                <option value="default">Default</option>
                <option value="price-asc">Lowest Price</option>
                <option value="price-desc">Highest Price</option>
                <option value="avail">Available First</option>
                <option value="name">Name (A–Z)</option>
              </select>
              <span class="text-muted" id="resultCount" style="margin-left:auto"></span>
            </div>

            <div id="medicineResults" class="grid grid-auto"></div>
            <div id="medicineEmpty" class="empty hide">
              <div class="empty__icon">🔎</div>
              <div class="empty__title">No medicines found</div>
              <p class="empty__desc">Try searching with another medicine name or adjusting your filters.</p>
              <a class="btn btn--primary" href="medicines.html">Reset</a>
            </div>
          </section>
        </div>
      </div>
    </main>

    <footer class="footer" data-footer></footer>
    <script type="module" src="/js/medicines-page.js"></script>
  </body>
</html>
